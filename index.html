<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Анимация 22 — 3D полицейская будка</title>
<style>
:root { color-scheme: dark; }
* {box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090f1e;color:#e7edf8;font-family:Arial,Helvetica,sans-serif}
main{text-align:center;padding:20px 12px;width:100%}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 8px}
p{color:#a9b9d3;margin:0 0 4px;line-height:1.5}
.scene{width:min(100%,600px);height:550px;margin:auto;perspective:900px;perspective-origin:50% 43%;display:grid;place-items:center;overflow:hidden}
.world{width:210px;height:350px;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite;transform-origin:50% 50%}
@keyframes spin{from{transform:rotateX(-9deg) rotateY(0deg)}to{transform:rotateX(-9deg) rotateY(360deg)}}
.face{position:absolute;backface-visibility:visible}
/* Each side is a plane of the actual cuboid, not a flat illustration. */
.wall{width:210px;height:350px;top:0;left:0;background:linear-gradient(90deg,#254468,#35577c 12%,#3c608a 48%,#35567c 90%,#213e61);border:7px solid #1c3556;box-shadow:inset 0 0 0 3px #50729b;overflow:hidden}
.front{transform:translateZ(105px)}
.back{transform:rotateY(180deg) translateZ(105px)}
.right{transform:rotateY(90deg) translateZ(105px)}
.left{transform:rotateY(-90deg) translateZ(105px)}
.wall::before,.wall::after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#1d3554;z-index:5}
.wall::before{left:3px}.wall::after{right:3px}
.sign{height:31px;position:absolute;top:20px;left:7px;right:7px;background:#1e3652;color:white;border:2px solid #607996;box-shadow:0 2px 0 #12253f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;letter-spacing:.7px}
.doors{position:absolute;top:57px;bottom:0;left:8px;right:8px;display:flex;gap:3px}
.door{flex:1;border:3px solid #1b3555;box-shadow:inset 0 0 0 2px #53749a;position:relative;padding:5px;display:flex;flex-direction:column;gap:7px}
.window{height:76px;border:4px solid #152d49;box-shadow:0 0 0 2px #7590ad;background:linear-gradient(130deg,#fbffff,#d8eafa);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:1px}
.window i{border-right:1px solid #65869e;border-bottom:1px solid #65869e;display:block}
.panel{border:3px double #233e61;box-shadow:inset 0 0 0 1px #6482aa;flex:1;background:#3c5c82}
.handle{position:absolute;right:6px;top:145px;width:4px;height:10px;background:#d5e4ef;border-radius:2px}
.roof{width:228px;height:228px;left:-9px;top:-9px;background:#345980;border:8px solid #233e60;transform:rotateX(90deg) translateZ(114px);box-shadow:inset 0 0 0 8px #496d96}
.roof-tier{width:190px;height:190px;left:10px;top:10px;background:#41658c;border:10px solid #254467;transform:rotateX(90deg) translateZ(124px)}
.base{width:236px;height:236px;left:-13px;top:0;background:#284668;border:9px solid #192f4c;transform:rotateX(90deg) translateZ(-353px)}
/* Top-mounted light: four vertical faces and a cap */
.lamp{position:absolute;width:25px;height:29px;top:-45px;left:93px;transform-style:preserve-3d}
.lamp-side{position:absolute;width:25px;height:29px;background:linear-gradient(#fff,#dbe5f0);border:2px solid #a1afbf;box-shadow:inset 0 -6px #d5e2ef}
.lamp-side:nth-child(1){transform:translateZ(12.5px)}
.lamp-side:nth-child(2){transform:rotateY(90deg) translateZ(12.5px)}
.lamp-side:nth-child(3){transform:rotateY(180deg) translateZ(12.5px)}
.lamp-side:nth-child(4){transform:rotateY(270deg) translateZ(12.5px)}
.lamp-top{position:absolute;width:25px;height:25px;background:#f6f8fb;border:2px solid #c9d3de;transform:rotateX(90deg) translateZ(12.5px)}
@media(max-width:550px){.scene{height:465px;perspective:820px}.world{scale:.78}}
@media(prefers-reduced-motion:reduce){.world{animation-play-state:paused}}
</style>
</head>
<body>
<main>
<h1>Анимация 22 — 3D полицейская будка</h1>
<p>Трёхмерная фигура вращается вокруг своей вертикальной оси средствами CSS</p>
<div class="scene" id="scene" aria-label="Вращающаяся трёхмерная синяя полицейская будка">
  <div class="world">
    <div class="face wall front"><div class="sign">POLICE &nbsp; BOX</div><div class="doors"><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div><div class="handle"></div></div><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div></div></div>
    <div class="face wall right"><div class="sign">POLICE &nbsp; BOX</div><div class="doors"><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div></div></div>
    <div class="face wall back"><div class="sign">POLICE &nbsp; BOX</div><div class="doors"><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div></div></div>
    <div class="face wall left"><div class="sign">POLICE &nbsp; BOX</div><div class="doors"><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div><div class="door"><div class="window"><i></i><i></i><i></i><i></i></div><div class="panel"></div><div class="panel"></div></div></div></div>
    <div class="face roof"></div><div class="face roof-tier"></div><div class="face base"></div>
    <div class="lamp"><div class="lamp-side"></div><div class="lamp-side"></div><div class="lamp-side"></div><div class="lamp-side"></div><div class="lamp-top"></div></div>
  </div>
</div>
</main>

</body>
</html>
